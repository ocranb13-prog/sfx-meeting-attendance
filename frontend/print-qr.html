<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print QR code</title>
  <style>
    @page { size: A4; margin: 12mm; }
    body { margin: 0; background: #eef1f5; font-family: "Segoe UI", Arial, sans-serif; color: #000; }
    .bar { background: #083b7a; color: #fff; padding: 10px 16px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .bar button { background: #fff; color: #083b7a; border: 0; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .sheet { background: #fff; width: 210mm; max-width: 100%; min-height: 270mm; margin: 14px auto; padding: 14mm 12mm; text-align: center; box-sizing: border-box; }
    .sheet img.logo { max-height: 26mm; max-width: 50mm; object-fit: contain; }
    .hospital { color: #0b4ea2; font-size: 24px; font-weight: 800; margin: 6px 0 14px; text-transform: uppercase; }
    .heading { font-size: 28px; font-weight: 800; border-bottom: 3px solid #0b4ea2; padding-bottom: 10px; margin-bottom: 18px; }
    .title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    .meta { font-size: 18px; margin: 4px 0; }
    .qr { margin: 22px auto 14px; width: 115mm; height: 115mm; background: #fff; }
    .qr img { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .instr { font-size: 19px; font-weight: 700; margin-top: 10px; }
    .contact { font-size: 12px; color: #555; margin-top: 18px; }
    #msg { text-align: center; padding: 30px; }
    @media print { body { background: #fff; } .bar { display: none; } .sheet { margin: 0; width: auto; min-height: 0; padding: 0; } }
  </style>
</head>
<body>
  <div class="bar"><span>QR code print sheet</span><button type="button" onclick="window.print()">Print</button></div>
  <p id="msg">Loading...</p>
  <div class="sheet" id="sheet" hidden>
    <img id="logo" class="logo" alt="" hidden>
    <div class="hospital" id="hospital"></div>
    <div class="heading">MEETING ATTENDANCE REGISTRATION</div>
    <div class="title" id="title"></div>
    <div class="meta" id="date"></div>
    <div class="meta" id="time"></div>
    <div class="meta" id="venue"></div>
    <div class="qr"><img id="qr" alt="Meeting QR code"></div>
    <div class="instr" id="instr"></div>
    <div class="contact" id="contact"></div>
  </div>
  <script type="module" src="/js/print-qr.js"></script>
</body>
</html>
